environment: prod
auth:
  method: ksefToken
  keychainServiceName: ksefctl
organizations:
  - nip: "1234567890"
    label: "Org A"
    outputPath: /path/to/custom-output/org-a
  - nip: "9876543210"
    label: "Org B"
pollingIntervalSeconds: 300
storage:
  root: /path/to/storage
logging:
  level: info
  file: /path/to/storage/logs/ksefctl.log
  pretty: true
notifications:
  macosNotification: true
  unpaidInvoiceCatchUp: false
  email:
    enabled: false
operational:
  timeoutSeconds: 60
  pollIntervalSeconds: 10
security:
  tls:
    enablePinning: false
  allowedHosts: []
sync:
  subjectTypes: [Subject1, Subject2, Subject3]
  generatePdf: true
  pdfGenerationTimeoutMs: 30000
  pdfMaxConsecutiveTimeouts: 3
  flatSync: false
